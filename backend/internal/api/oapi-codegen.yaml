# Config for oapi-codegen. Run `make generate` from the repo root.
package: api
output: api.gen.go
generate:
  models: true
  echo-server: true
  strict-server: true
  # Embeds the spec so tests can validate responses against it.
  embedded-spec: true
output-options:
  # The alertDelivery webhook is a request the app sends, not one it serves.
  exclude-operation-ids:
    - receiveAlert
  # Keeps WebhookAlertPayload, which only that webhook refers to.
  skip-prune: true
