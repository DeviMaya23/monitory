# Fly.io deployment (deploy/README.md). Secrets are never set here: use `fly secrets set`.
app = "monitory"
primary_region = "syd"

# The image is built from the repository's Dockerfile.
[build]

# Non-secret configuration. Every other key keeps its default from .env.example.
# LISTEN_ADDR and DATABASE_PATH are set in the Dockerfile.
[env]
  REQUIRE_HTTPS = "true"
  TRUST_PROXY = "true"
  CLIENT_IP_HEADER = "Fly-Client-IP"

# The SQLite file lives on this volume. One volume means one machine.
[[mounts]]
  source = "monitory_data"
  destination = "/data"

# The machine never stops: checks run in the background with no request arriving.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
